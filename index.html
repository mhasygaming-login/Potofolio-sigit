    <!-- Dynamic canonical & og:url resolution for SPA context -->
    <script>
      (function () {
        var currentUrl = window.location.origin + window.location.pathname;
        var canonical = document.createElement('link');
        canonical.rel = 'canonical';
        canonical.href = currentUrl;
        document.head.appendChild(canonical);

        var ogUrl = document.createElement('meta');
        ogUrl.setAttribute('property', 'og:url');
        ogUrl.content = currentUrl;
        document.head.appendChild(ogUrl);
      })();
    </script>

    <!-- Pre-paint mode initialization (prevents theme flash on reload) -->
    <script>
      (function () {
        try {
          var savedMode = window.localStorage.getItem('sigit-portfolio-mode');
          var mode = savedMode === 'network' ? 'network' : 'gdg';
          document.documentElement.setAttribute('data-theme-mode', mode);
          if (mode === 'network') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme-mode', 'gdg');
        }
      })();
    </script>
